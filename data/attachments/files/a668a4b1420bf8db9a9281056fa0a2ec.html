<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>星际战机 · 曙光防线</title>
<style>
:root{--ink:#05080c;--bone:#e8eef2;--dim:rgba(232,238,242,.62);--faint:rgba(232,238,242,.2);--cy:#72e4ff;--am:#ffb347;--rd:#ff5a40;--gn:#7dffb0;
  --plate:rgba(8,12,18,.66);--f:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;--m:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sl:max(18px,env(safe-area-inset-left));--sr:max(18px,env(safe-area-inset-right));--st:max(14px,env(safe-area-inset-top));--sb:max(14px,env(safe-area-inset-bottom))}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);font-family:var(--f);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{pointer-events:none}
body.play #gl{cursor:none}
#ui{position:fixed;inset:0;pointer-events:none;font-size:13px}
.hide{display:none!important}
/* ---------- HUD ---------- */
.hb{position:absolute;text-shadow:0 0 3px #000,0 1px 6px rgba(0,0,0,.7)}
.k{font-size:11px;letter-spacing:.2em;color:var(--dim)}
.n{font:600 28px/1.1 var(--m);letter-spacing:.04em}
.s{font-size:12px;color:var(--am);letter-spacing:.12em;margin-top:2px}
.tl{left:var(--sl);top:var(--st)}
.tc{left:50%;top:var(--st);transform:translateX(-50%);text-align:center}
.bl{left:var(--sl);bottom:var(--sb)}
.br{right:var(--sr);bottom:var(--sb);text-align:right}
.row{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:11px;letter-spacing:.2em;color:var(--dim)}
.br .row{justify-content:flex-end}
.bar{width:150px;height:6px;background:rgba(232,238,242,.12);outline:1px solid var(--faint);outline-offset:1px}
.bar.w{width:min(300px,44vw);margin-top:6px}
.bar i{display:block;height:100%;width:100%;background:var(--bone);transition:width .15s linear}
.bar i.cy{background:var(--cy)}.bar i.gn{background:var(--gn)}.bar i.am{background:var(--am)}.bar i.rd{background:var(--rd)}
#hMis{font:600 13px var(--m);color:var(--bone);letter-spacing:.1em}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;opacity:0;transition:opacity .5s;text-shadow:0 0 12px rgba(0,0,0,.8)}
#banner.on{opacity:1}
#banner b{display:block;font-size:clamp(26px,5vw,46px);font-weight:800;letter-spacing:.3em;margin-right:-.3em}
#banner span{display:block;margin-top:8px;font-size:13px;letter-spacing:.24em;color:var(--am)}
#warn{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:14px;letter-spacing:.3em;color:var(--rd);font-weight:700;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
#radio{position:absolute;left:50%;bottom:calc(var(--sb) + 150px);transform:translateX(-50%);max-width:min(560px,86vw);background:var(--plate);border-left:2px solid var(--cy);padding:8px 14px;font-size:14px;line-height:1.5;opacity:0;transition:opacity .4s}
#radio.on{opacity:1}
#radio b{color:var(--cy);font-weight:600;margin-right:8px;letter-spacing:.1em}
/* ---------- 触屏 ---------- */
#touch>*{pointer-events:auto;position:absolute;touch-action:none}
#stick{left:var(--sl);bottom:calc(var(--sb) + 60px);width:130px;height:130px;border-radius:50%;border:1px solid var(--faint);background:rgba(232,238,242,.05)}
#stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(232,238,242,.22)}
.tb{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;border:1px solid var(--faint);background:rgba(232,238,242,.07);font-size:12px;letter-spacing:.1em}
.tb.on{background:rgba(114,228,255,.3)}
#tFire{right:var(--sr);bottom:calc(var(--sb) + 70px);width:92px;height:92px;border-color:var(--cy)}
#tMis{right:calc(var(--sr) + 104px);bottom:calc(var(--sb) + 60px)}
#tBoost{right:calc(var(--sr) + 30px);bottom:calc(var(--sb) + 176px)}
#tPause{right:var(--sr);top:calc(var(--st) + 44px);width:40px;height:40px}
/* ---------- 菜单 ---------- */
#panel,#boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:auto;padding:20px;box-sizing:border-box;text-align:center}
#panel{background:radial-gradient(ellipse at center,rgba(5,8,12,.5),rgba(5,8,12,.82))}
#boot{background:var(--ink);transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
.mark{font-size:clamp(40px,9vw,88px);font-weight:900;letter-spacing:.22em;margin-right:-.22em;line-height:1}
.tag{font-size:13px;letter-spacing:.5em;margin-right:-.5em;color:var(--am);margin-bottom:22px}
h2{margin:0 0 10px;font-size:26px;letter-spacing:.3em;margin-right:-.3em}
button{font:inherit;color:var(--bone);background:rgba(232,238,242,.06);border:1px solid var(--faint);padding:12px 0;width:min(260px,70vw);font-size:15px;letter-spacing:.3em;cursor:pointer;transition:background .15s,border-color .15s}
button:hover,button:focus-visible{background:rgba(114,228,255,.16);border-color:var(--cy);outline:none}
button.pri{border-color:var(--cy);background:rgba(114,228,255,.1)}
.foot{margin-top:16px;font:12px var(--m);color:var(--dim);letter-spacing:.14em}
label{display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(340px,82vw);font-size:14px;letter-spacing:.1em}
input[type=range]{width:160px;accent-color:var(--cy)}
select{font:inherit;color:var(--bone);background:#10161d;border:1px solid var(--faint);padding:5px 8px}
.help{display:grid;grid-template-columns:auto auto;gap:7px 22px;text-align:left;font-size:14px;margin-bottom:10px}
.help b{color:var(--cy);font-weight:600;font-family:var(--m)}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 26px;font-size:15px;margin:6px 0 14px;text-align:left}
.stats b{font-family:var(--m);text-align:right;color:var(--am)}
.pbar{width:min(320px,70vw);height:2px;background:#1b2229}.pbar i{display:block;height:100%;width:0;background:var(--cy);transition:width .25s}
#err{color:var(--rd);font:12px/1.5 var(--m);white-space:pre-wrap;max-width:90vw;text-align:left}
</style>
</head>
<body>
<canvas id="gl"></canvas><canvas id="hud"></canvas>
<div id="ui">
  <div id="hudBox" class="hide">
    <div class="hb tl"><div class="k">得分</div><div class="n" id="hScore">0</div><div class="s" id="hWave"></div></div>
    <div class="hb tc"><div class="k">曙光站 · 结构完整度</div><div class="bar w"><i id="bSt"></i></div></div>
    <div class="hb bl"><div class="row"><span>护盾</span><div class="bar"><i id="bSh" class="cy"></i></div></div><div class="row"><span>船体</span><div class="bar"><i id="bHu" class="gn"></i></div></div></div>
    <div class="hb br"><div class="row"><div class="bar"><i id="bHt" class="am"></i></div><span>炮温</span></div><div class="row"><div class="bar"><i id="bEn" class="cy"></i></div><span>推进</span></div><div class="row"><span id="hMis">导弹 ×6</span></div></div>
    <div id="banner"><b></b><span></span></div>
    <div id="warn"></div>
    <div id="radio"><b></b><span></span></div>
  </div>
  <div id="touch" class="hide"><div id="stick"><i></i></div><div id="tBoost" class="tb">加速</div><div id="tMis" class="tb">导弹</div><div id="tFire" class="tb">开火</div><div id="tPause" class="tb">Ⅱ</div></div>
  <div id="panel" class="hide"></div>
  <div id="boot"><div class="mark">星际战机</div><div class="tag" id="bootT">正在启动</div><div class="pbar"><i id="bootB"></i></div><div id="err"></div></div>
</div>
<script>
'use strict';
/* =====================================================================
   星际战机 · 曙光防线 —— 单文件、零素材：贴图、模型、音效、音乐全部运行时生成
   目录：1 基础数学 · 2 渲染器 · 3 着色器 · 4 模型 · 5 音频 · 6 玩法 · 7 渲染帧 · 8 HUD · 9 菜单与输入 · 10 启动
   ===================================================================== */
/* ---------- 1 基础数学 ---------- */
const $=s=>document.querySelector(s),M=Math,{sin,cos,min,max,abs,hypot,PI,sqrt}=M,R=M.random;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const ad=(a,b,s=1)=>[a[0]+b[0]*s,a[1]+b[1]*s,a[2]+b[2]*s];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const sc=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>hypot(a[0],a[1],a[2]);
const nm=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]};
const dist=(a,b)=>hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const rnd=(a=1,b)=>b===undefined?(R()*2-1)*a:a+R()*(b-a);
const rdir=()=>{const z=R()*2-1,a=R()*2*PI,r=sqrt(1-z*z);return[r*cos(a),z,r*sin(a)]};
const Z=[0,0,0];
// 朝向矩阵（列主序 mat3）：列 = 右、上、前
const basis=(f,roll=0)=>{const x=nm([f[2],0,-f[0]]),y=cross(f,x),c=cos(roll),s=sin(roll);
  return[x[0]*c+y[0]*s,x[1]*c+y[1]*s,x[2]*c+y[2]*s,y[0]*c-x[0]*s,y[1]*c-x[1]*s,y[2]*c-x[2]*s,f[0],f[1],f[2]]};
const rotAxis=(a,t)=>{const c=cos(t),s=sin(t),k=1-c,x=a[0],y=a[1],z=a[2];
  return[c+x*x*k,y*x*k+z*s,z*x*k-y*s,x*y*k-z*s,c+y*y*k,z*y*k+x*s,x*z*k+y*s,y*z*k-x*s,c+z*z*k]};
const loc=(p,b,v,s=1)=>[p[0]+(b[0]*v[0]+b[3]*v[1]+b[6]*v[2])*s,p[1]+(b[1]*v[0]+b[4]*v[1]+b[7]*v[2])*s,p[2]+(b[2]*v[0]+b[5]*v[1]+b[8]*v[2])*s];

/* ---------- 设置 ---------- */
const opt={sens:1,vol:.8,q:1,shake:.5,best:0};
try{Object.assign(opt,JSON.parse(localStorage.getItem('dawnline')||'{}'))}catch(e){}
const saveOpt=()=>{try{localStorage.setItem('dawnline',JSON.stringify(opt))}catch(e){}};

/* ---------- 2 渲染器 ---------- */
const cv=$('#gl'),hudC=$('#hud'),hx=hudC.getContext('2d');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,depth:false,powerPreference:'high-performance'});
let HDR=false,IFMT,W=1,H=1,RW=1,RH=1,fbMS,rbC,rbD,scene,bloom=[],skyTex,curP;
const FL=1.6,SUNV=nm([-.8,.35,.3]);
const HEAD='#version 300 es\nprecision highp float;precision highp int;\n';
function prog(vs,fs){const p=gl.createProgram();
  for(const[t,s]of[[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const o=gl.createShader(t);gl.shaderSource(o,HEAD+s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error('着色器编译失败\n'+gl.getShaderInfoLog(o));gl.attachShader(p,o)}
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error('着色器链接失败\n'+gl.getProgramInfoLog(p));
  const u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const k=gl.getActiveUniform(p,i).name.replace('[0]','');u[k]=gl.getUniformLocation(p,k)}
  return{p,u}}
function mkTex(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texStorage2D(gl.TEXTURE_2D,1,IFMT,w,h);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return{t,f,w,h}}
function resize(){
  const dpr=min(window.devicePixelRatio||1,[1,1.5,2][opt.q]);W=innerWidth;H=innerHeight;
  RW=max(2,W*dpr|0);RH=max(2,H*dpr|0);cv.width=RW;cv.height=RH;
  const hd=min(window.devicePixelRatio||1,2);hudC.width=W*hd;hudC.height=H*hd;hx.setTransform(hd,0,0,hd,0,0);
  if(!gl||!IFMT)return;
  if(fbMS){gl.deleteFramebuffer(fbMS);gl.deleteRenderbuffer(rbC);gl.deleteRenderbuffer(rbD);for(const b of[scene,...bloom]){gl.deleteTexture(b.t);gl.deleteFramebuffer(b.f)}}
  const smp=min(4,gl.getParameter(gl.MAX_SAMPLES));
  fbMS=gl.createFramebuffer();rbC=gl.createRenderbuffer();rbD=gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER,rbC);gl.renderbufferStorageMultisample(gl.RENDERBUFFER,smp,IFMT,RW,RH);
  gl.bindRenderbuffer(gl.RENDERBUFFER,rbD);gl.renderbufferStorageMultisample(gl.RENDERBUFFER,smp,gl.DEPTH_COMPONENT24,RW,RH);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbMS);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,rbC);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,rbD);
  scene=mkTex(RW,RH);bloom=[];let w=RW,h=RH;for(let i=0;i<5;i++){w=max(1,w>>1);h=max(1,h>>1);bloom.push(mkTex(w,h))}
  gl.bindFramebuffer(gl.FRAMEBUFFER,null)}

/* ---------- 3 着色器 ---------- */
const GLC=`const vec3 SUN=normalize(vec3(-.8,.35,.3)),PLN=normalize(vec3(.55,.12,.8));
float H(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float N(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(H(i),H(i+vec3(1,0,0)),f.x),mix(H(i+vec3(0,1,0)),H(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(H(i+vec3(0,0,1)),H(i+vec3(1,0,1)),f.x),mix(H(i+vec3(0,1,1)),H(i+vec3(1,1,1)),f.x),f.y),f.z);}
float F(vec3 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*N(p);p=p*2.02+7.;a*=.5;}return s;}
`;
const VS_FS=`out vec2 uv;void main(){vec2 q=vec2(gl_VertexID&1,gl_VertexID>>1)*2.;uv=q;gl_Position=vec4(q*2.-1.,0,1);}`;
// 星空烘焙：只在启动时算一次，写进立方体贴图。刻意做得暗、稀疏、低饱和 —— 背景越安静越不晕
const FS_BAKE=`in vec2 uv;uniform mat3 Fm;out vec4 o;
${GLC}
void main(){
 vec3 r=normalize(Fm*vec3(uv*2.-1.,1.));
 vec3 c=vec3(.0022,.003,.0055);
 vec3 G=normalize(vec3(.3,.86,-.4));float g=pow(1.-abs(dot(r,G)),7.);
 float dn=F(r*5.+vec3(3.,1.,7.));
 c+=vec3(.07,.066,.08)*g*(.25+1.3*dn*dn)*smoothstep(.72,.35,F(r*9.+20.));
 float m1=pow(max(dot(r,normalize(vec3(-.75,.25,-.6))),0.),4.);
 c+=vec3(.028,.07,.1)*m1*pow(F(r*3.5+5.),2.)*2.;
 float m2=pow(max(dot(r,normalize(vec3(.2,-.6,-.75))),0.),5.);
 c+=vec3(.09,.04,.028)*m2*pow(F(r*4.-3.),2.)*1.8;
 for(float i=0.;i<3.;i++){
  vec3 q=r*(120.+i*95.),j=floor(q);float h=H(j+i*13.),th=.994+i*.001;
  if(h>th){vec3 of=vec3(H(j+1.7),H(j+2.9),H(j+4.3))-.5;float d=length(q-j-.5-of*.6),b=(h-th)/(1.-th);
   c+=mix(vec3(1.,.82,.66),vec3(.72,.84,1.),H(j+6.1))*smoothstep(.22,0.,d)*(.1+b*b*1.2)*(1.+g*1.5);}
 }
 vec3 pc=PLN*10.,ax=normalize(vec3(.22,.95,-.2));float b=dot(r,pc),hh=b*b-dot(pc,pc)+6.76,tp=1e9;
 if(hh>0.&&b>0.){tp=b-sqrt(hh);vec3 n=normalize(r*tp-pc);float l=max(dot(n,SUN),0.),lat=dot(n,ax);
  float bd=F(vec3(lat*7.,.5,.5)+.35*F(n*3.))+.2*sin(lat*26.);
  vec3 pn=mix(vec3(.3,.38,.46),vec3(.68,.62,.52),smoothstep(.3,.8,bd));
  pn=mix(pn,vec3(.2,.25,.34),smoothstep(.55,.2,F(vec3(lat*15.,2.,n.x*.6)))*.5);
  c=mix(c,pn*pow(l,.8)*.8+vec3(.22,.4,.75)*pow(1.+dot(n,r),4.)*(l*.9+.03),smoothstep(0.,.22,hh));}
 float tr=dot(pc,ax)/dot(r,ax);
 if(tr>0.&&tr<tp){vec3 hp=r*tr-pc;float rr=length(hp);
  if(rr>3.3&&rr<6.1){float a=(.35+.65*N(vec3(rr*14.,1.,1.)))*smoothstep(3.3,3.5,rr)*smoothstep(6.1,5.6,rr)*(1.-.8*smoothstep(.08,0.,abs(rr-4.75)));
   float sb=dot(hp,SUN),sh=(sb<0.&&dot(hp,hp)-sb*sb<6.76)?.08:1.;
   c=mix(c,vec3(.58,.53,.45)*sh*.7,a*.75);}}
 o=vec4(sqrt(clamp(c,0.,1.)),1);}`;
const CAMU=`uniform mat3 C;uniform vec3 E;uniform vec4 A;`;
const PROJ=`vec3 v=(w-E)*C;gl_Position=vec4(v.xy*A.xy,v.z-2.,v.z);`;
const VS_SKY=CAMU+`out vec3 d;void main(){vec2 q=vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.;d=C*vec3(q/A.xy,1.);gl_Position=vec4(q,0,1);}`;
const FS_SKY=`in vec3 d;uniform samplerCube Sky;out vec4 o;
const vec3 SUN=normalize(vec3(-.8,.35,.3));
void main(){vec3 r=normalize(d),c=texture(Sky,r).rgb;c*=c;float s=max(dot(r,SUN),0.);
 c+=vec3(1.,.86,.66)*(pow(s,5000.)*40.+pow(s,300.)*.6+pow(s,14.)*.035);o=vec4(c,1);}`;
const VS_MESH=CAMU+`layout(location=0)in vec3 p;layout(location=1)in vec4 c;uniform mat3 M;uniform vec3 P;uniform float S;
out vec3 w,q;out vec4 k;void main(){q=p;w=M*p*S+P;k=c;${PROJ}}`;
// 光照：太阳 GGX 高光 + 行星反光补光 + 立方体贴图环境反射
const SHADE=`uniform samplerCube Sky;
vec3 shade(vec3 n,vec3 v,vec3 alb,float rough,float metal){
 vec3 V=-v,L=SUN,Hh=normalize(L+V);float nl=max(dot(n,L),0.),nv=max(dot(n,V),.001),nh=max(dot(n,Hh),0.);
 float a=rough*rough,a2=a*a,dd=nh*nh*(a2-1.)+1.,D=a2/(3.1416*dd*dd),kk=a*.5,vis=.25/((nl*(1.-kk)+kk)*(nv*(1.-kk)+kk));
 vec3 F0=mix(vec3(.04),alb,metal),Fr=F0+(1.-F0)*pow(1.-max(dot(Hh,V),0.),5.),dif=alb*(1.-metal*.85);
 vec3 c=(dif/3.1416+min(D*vis,6.)*Fr)*nl*vec3(1.,.93,.82)*4.5;
 c+=dif*vec3(.24,.36,.5)*max(dot(n,PLN),0.)*.4;
 vec3 e=textureLod(Sky,reflect(v,n),1.+rough*6.).rgb;e*=e;vec3 ei=textureLod(Sky,n,8.).rgb;ei*=ei;
 c+=dif*(ei*1.6+.025)+e*(F0+(1.-F0)*pow(1.-nv,5.)*(1.-rough))*1.6;
 return c;}`;
// 舰体：法线用屏幕空间导数求；装甲板缝、色差、舷窗全部由物体空间坐标程序化生成
const FS_HULL=`in vec3 w,q;in vec4 k;uniform mat3 M;uniform vec3 E,K;uniform vec4 T;out vec4 o;
${GLC}${SHADE}
void main(){
 vec3 v=normalize(w-E),n=normalize(cross(dFdx(w),dFdy(w)));if(dot(n,v)>0.)n=-n;
 vec3 no=abs(n*M);vec2 u=(no.x>no.y&&no.x>no.z?q.zy:no.y>no.z?q.xz:q.xy)*T.z;
 float fw=max(fwidth(u.x),fwidth(u.y)),fade=clamp(1.-fw*1.5,0.,1.);
 vec2 ce=floor(u),f=fract(u);float h=H(vec3(ce,3.));
 if(h>.6){f=fract(f*2.);h=H(vec3(ce*2.+floor(fract(u)*2.),5.));}

    // 开火
    e.cd-=dt;
    if(e.cd<=0&&state==='play'){const fire=(dir,st)=>{shots.push({p:ad(e.p,e.f,T.r*.8),v:dir,spd:T.bspd,life:st?3.4:2.2,own:1,dmg:T.dmg,col:T.col,len:st?5:6,w:st?1.5:.55});sfx('elaser',e.p,st?1:.7)};
      if(T.turret){const pd=dist(e.p,pl.p);if(pl.alive&&pd<850){fire(nm(ad(nm(sub(ad(pl.p,pl.f,pl.spd*pd/T.bspd),e.p)),rdir(),.035)));e.cd=++e.burst%6?.15:rnd(1.6,2.4)}else e.cd=.3}
      else if(e.brk<=0&&L<(T.bomber?720:650)&&dot(e.f,aim)>(T.bomber?.9:.955)){fire(nm(ad(aim,rdir(),.025)),T.bomber);e.cd=rnd(T.cd[0],T.cd[1])}
      else e.cd=.1}
    // 撞击玩家
    if(pl.alive&&dist(e.p,pl.p)<T.r+4){pl.p=ad(pl.p,nm(sub(pl.p,e.p)),6);if(pl.hitCd<=0){pl.hitCd=.7;hurt(22,1);e.hp-=70;e.fl=1;if(e.hp<=0)killFoe(e)}}}
  foes=foes.filter(e=>!e.dead)}

function updShots(dt){
  for(const s of shots){const st=s.spd*dt;let dead=0;
    if(s.own){if(pl.alive&&seg(s,pl.p,4.5,st)){dead=1;hurt(s.dmg)}else if(!ST.dead&&stPen(ad(s.p,s.v,st),2)){dead=1;stDmg(s.dmg)}}
    else{for(const e of foes)if(!e.dead&&seg(s,e.p,e.T.r,st)){dead=1;e.hp-=s.dmg;e.fl=1;sfx('hit',e.p,.6);if(e.hp<=0)killFoe(e);break}
      if(!dead&&!ST.dead&&stPen(ad(s.p,s.v,st),0))dead=1}
    if(!dead)for(const r of rocks)if(seg(s,r.p,r.rad*.92,st)){dead=1;break}
    s.p=ad(s.p,s.v,st);s.life-=dt;if(dead){sparks(s.p,s.col,4);s.life=0}}
  shots=shots.filter(s=>s.life>0);
  for(const m of miss){const t=m.tgt;
    if(t&&!t.dead)m.f=nm(ad(m.f,sub(nm(sub(lead(t,m.p,m.spd),m.p)),m.f),min(1,4.5*dt)));
    m.spd=min(340,m.spd+260*dt);m.p=ad(m.p,m.f,m.spd*dt);m.life-=dt;
    part(0,ad(m.p,m.f,-1.5),sc(rdir(),3),.45,1.6,[1.6,.9,.4],.5,.7);
    let hit=m.life<=0;for(const e of foes)if(!e.dead&&dist(e.p,m.p)<e.T.r+3)hit=1;
    for(const r of rocks)if(dist(r.p,m.p)<r.rad)hit=1;if(!ST.dead&&stPen(m.p,0))hit=1;
    if(hit){m.life=0;boom(m.p,1.2);for(const e of foes){const d=dist(e.p,m.p)-e.T.r;if(d<45){e.hp-=d<6?240:90;e.fl=1;if(e.hp<=0)killFoe(e)}}}}
  miss=miss.filter(m=>m.life>0)}

function update(dt){
  G.t+=dt;G.shake=max(0,G.shake-dt*2.2);G.flash=max(0,G.flash-dt*1.6);
  ST.ang+=dt*.025;ST.b=rotAxis([0,1,0],ST.ang);
  for(const r of rocks){r.ang+=r.w*dt;r.b=rotAxis(r.ax,r.ang)}
  updPlayer(dt);updFoes(dt);updShots(dt);
  for(const q of parts){q.p=ad(q.p,q.v,dt);if(q.drag)q.v=sc(q.v,max(0,1-q.drag*dt));q.life-=dt}parts=parts.filter(q=>q.life>0);
  for(const d of debris){d.p=ad(d.p,d.v,dt);d.ang+=d.w*dt;d.life-=dt}debris=debris.filter(d=>d.life>0);
  for(const k of picks){k.life-=dt;const d=dist(k.p,pl.p);if(pl.alive&&d<90)k.p=ad(k.p,nm(sub(pl.p,k.p)),min(d,(pl.spd+90)*dt));
    if(pl.alive&&d<12){k.life=0;sfx('pickup');if(k.k){pl.mis=min(12,pl.mis+3);banner('','导弹 +3',1.4)}else{pl.hull=min(1,pl.hull+.3);banner('','船体修复 +30%',1.4)}}}
  picks=picks.filter(k=>k.life>0);
  if(state==='play'&&pl.alive&&!ST.dead){
    if(G.active&&!foes.length){G.active=0;G.intense=0;G.wt=7;G.score+=150*G.wave;ST.hp=min(1,ST.hp+.06);banner('战区已肃清','奖励 +'+150*G.wave,2.6);
      say('指挥中心：干得漂亮。抓紧修整，下一波正在集结。',4.5)}
    if(!G.active&&(G.wt-=dt)<=0)spawnWave();
    if(pl.hull<.3&&(G.alarmT-=dt)<0){G.alarmT=1.3;sfx('alarm')}}
  if(G.over>0&&(G.over-=dt)<=0&&state==='play')showOver();
  if(G.radio&&(G.radio.t+=dt)>G.radio.dur)G.radio=null;if(G.ban&&(G.ban.t-=dt)<0)G.ban=null;
  if(aEng){const t=AC.currentTime,a=pl.alive&&state==='play'?1:0;aEng.g.gain.setTargetAtTime(a*(.03+pl.spd/200*.07),t,.15);aEng.bp.frequency.setTargetAtTime(180+pl.spd*4,t,.15);
    aEng.g2.gain.setTargetAtTime(a*.05,t,.15);aEng.o.frequency.setTargetAtTime(38+pl.spd*.22,t,.15)}}

function updCam(dt){
  if(state==='menu'||state==='boot'){const a=time*.03+2.4,p=[sin(a)*400,70+sin(time*.02)*30,cos(a)*400];cam.p=p;cam.sf=cam.f=nm(sub([0,18,0],p))}
  else{cam.sf=nm(ad(cam.sf,sub(pl.f,cam.sf),min(1,8*dt)));cam.f=cam.sf}       // 轻微滞后，但不甩镜头、不滚转，地平线始终水平
  const b=basis(cam.f);cam.b=b;cam.r=b.slice(0,3);cam.u=b.slice(3,6);
  if(state!=='menu'&&state!=='boot'){const sh=G.shake*G.shake*opt.shake*.9;cam.p=ad(ad(ad(pl.p,cam.f,-25),cam.u,6.5),[rnd(sh),rnd(sh),rnd(sh)])}}

/* ---------- 7 渲染帧 ---------- */
function drawMesh(m,p,b,s,mat,flash){const u=curP.u;gl.uniform3fv(u.P,p);gl.uniformMatrix3fv(u.M,false,b);gl.uniform1f(u.S,s);gl.uniform4fv(u.T,mat);gl.uniform3fv(u.K,flash||Z);gl.drawArrays(gl.TRIANGLES,m[0],m[1])}
function render(){
  const A=[FL*RH/RW,FL,0,0];
  const use=P=>{gl.useProgram(P.p);gl.uniformMatrix3fv(P.u.C,false,cam.b);gl.uniform4fv(P.u.A,A);gl.uniform3fv(P.u.E,cam.p);gl.uniform1i(P.u.Sky,2);curP=P};
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbMS);gl.viewport(0,0,RW,RH);gl.depthMask(true);gl.clear(gl.DEPTH_BUFFER_BIT);gl.disable(gl.BLEND);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_CUBE_MAP,skyTex);gl.activeTexture(gl.TEXTURE0);
  gl.disable(gl.DEPTH_TEST);gl.bindVertexArray(vaoNone);use(pSky);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.DEPTH_TEST);gl.bindVertexArray(vaoMesh);use(pHull);
  if(!ST.dead)drawMesh(mStation,ST.p,ST.b,1,MAT.st);
  if(pl.alive&&state!=='menu')drawMesh(mShip,pl.p,pl.b,1,MAT.ship);
  for(const e of foes)drawMesh(e.T.mesh,e.p,basis(e.f,e.roll),e.T.s,e.T.mat,e.fl>0?[e.fl*.5,e.fl*.5,e.fl*.5]:null);
  for(const m of miss)drawMesh(mMis,m.p,basis(m.f),1,MAT.ship);
  for(const d of debris)drawMesh(mChunk,d.p,rotAxis(d.ax,d.ang),d.s,MAT.dark);
  use(pRock);for(const r of rocks)drawMesh(r.m,r.p,r.b||rotAxis(r.ax,r.ang),r.rad,MAT.rock);
  // —— 粒子 ——
  sn=0;
  for(const s of shots)spr(3,s.p,s.w,s.col,1,sc(s.v,s.len));
  for(const q of parts){const a=1-q.life/q.max;
    if(q.type==3)spr(3,q.p,q.size,q.col,q.a*(1-a),sc(q.v,.045));else spr(q.type,q.p,q.size*(1+q.grow*a),q.col,q.type?q.a:q.a*(1-a),null,a,q.seed)}
  if(pl.alive&&state!=='menu'){const L=1.1+pl.spd*.014,fl=.9+R()*.2;
    for(const s of[1.8,-1.8]){const e=loc(pl.p,pl.b,[s,.02,-6.7]);spr(0,e,1.5+pl.boost*.9,[.35,.8,2.2],.8*fl);spr(3,ad(e,pl.f,-L),.42,[.3,.75,2.2],.6*fl,sc(pl.f,L))}}
  for(const e of foes){const b=basis(e.f,e.roll),T=e.T;for(const g of T.eng){const p=loc(e.p,b,g,T.s);spr(0,p,T.es*T.s,T.ec,1);spr(3,ad(p,e.f,-2.2*T.s),.6*T.s,T.ec,.8,sc(e.f,2.2*T.s))}}
  for(const m of miss)spr(0,ad(m.p,m.f,-1.4),2.6,[2.4,1.3,.5],1);
  for(const k of picks){const c=k.k?[2,1.2,.3]:[.4,2,.9],pu=.75+.25*sin(time*6);spr(0,k.p,5*pu,c,.9);spr(2,k.p,4.5,c,.9,null,.2)}
  if(!ST.dead){const bl=.5+.5*sin(time*2.4);spr(0,loc(ST.p,ST.b,[0,98,0]),7,[2.2,.4,.3],bl);spr(0,loc(ST.p,ST.b,[0,-72,0]),6,[.4,2,.8],1-bl);spr(0,loc(ST.p,ST.b,[0,-10,43]),6,[.4,1.2,2.2],.7)}
  if(state==='play'&&pl.alive){const a=clamp((pl.spd-60)/140)*.5+.08,ax=sc(pl.f,.4+pl.spd*.012);          // 速度尘埃：很淡，只在加速时明显
    for(const d of dust){const q=[0,1,2].map(i=>((d[i]-cam.p[i])%240+360)%240-120+cam.p[i]);spr(3,q,.1,[.5,.6,.8],a,ax)}}
  gl.bindVertexArray(vaoSpr);gl.bindBuffer(gl.ARRAY_BUFFER,bufSpr);gl.bufferSubData(gl.ARRAY_BUFFER,0,SB.subarray(0,sn*14));
  use(pSpr);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,sn);gl.depthMask(true);
  // —— 解析多重采样 → 泛光 → 色调映射 ——
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,fbMS);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,scene.f);gl.blitFramebuffer(0,0,RW,RH,0,0,RW,RH,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);gl.bindVertexArray(vaoNone);gl.useProgram(pBlur.p);gl.uniform1i(pBlur.u.S,0);
  let src=scene;bloom.forEach((b,i)=>{gl.bindFramebuffer(gl.FRAMEBUFFER,b.f);gl.viewport(0,0,b.w,b.h);gl.bindTexture(gl.TEXTURE_2D,src.t);gl.uniform4f(pBlur.u.U,1/src.w,1/src.h,i?0:HDR?1.1:.8,0);gl.drawArrays(gl.TRIANGLES,0,3);src=b});
  gl.enable(gl.BLEND);for(let i=bloom.length-2;i>=0;i--){const b=bloom[i],s=bloom[i+1];gl.bindFramebuffer(gl.FRAMEBUFFER,b.f);gl.viewport(0,0,b.w,b.h);gl.bindTexture(gl.TEXTURE_2D,s.t);gl.uniform4f(pBlur.u.U,.5/s.w,.5/s.h,0,0);gl.drawArrays(gl.TRIANGLES,0,3)}
  gl.disable(gl.BLEND);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,RW,RH);gl.useProgram(pPost.p);
  gl.bindTexture(gl.TEXTURE_2D,scene.t);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,bloom[0].t);gl.activeTexture(gl.TEXTURE0);
  gl.uniform1i(pPost.u.S,0);gl.uniform1i(pPost.u.B,1);gl.uniform4f(pPost.u.U,state==='play'?G.flash+(pl.hull<.3&&pl.alive?.25+.15*sin(time*5):0):0,.09,time%10,0);gl.drawArrays(gl.TRIANGLES,0,3)}

/* ---------- 8 HUD ---------- */
const el={};['hScore','hWave','bSt','bSh','bHu','bHt','bEn','hMis','banner','warn','radio'].forEach(k=>el[k]=$('#'+k));
const setW=(e,v)=>{const s=M.round(clamp(v)*100)+'%';if(e._w!==s){e._w=s;e.style.width=s}};
const setT=(e,t)=>{if(e._t!==t){e._t=t;e.textContent=t}};
const setC=(e,c)=>{if(e._c!==c){e._c=c;e.className=c}};
function hud(){
  hx.clearRect(0,0,W,H);if(state!=='play'&&state!=='pause')return;
  setT(el.hScore,String(G.score));setT(el.hWave,G.wave?'第 '+G.wave+' 波 · 敌机 '+foes.length:'待命');
  setW(el.bSt,ST.hp);setC(el.bSt,ST.hp<.3?'rd':'');setW(el.bSh,pl.sh);setW(el.bHu,pl.hull);setC(el.bHu,pl.hull<.3?'rd':'gn');
  setW(el.bHt,pl.heat);setC(el.bHt,pl.hot?'rd':'am');setW(el.bEn,pl.en);setC(el.bEn,pl.enLock?'rd':'cy');setT(el.hMis,'导弹 ×'+pl.mis);
  const bn=G.ban;setC(el.banner,bn&&bn.t>.5?'on':'');if(bn){setT(el.banner.firstChild,bn.big);setT(el.banner.lastChild,bn.small)}
  const rd=G.radio;setC(el.radio,rd&&rd.t<rd.dur-.5?'on':'');if(rd){const i=rd.text.indexOf('：');setT(el.radio.firstChild,rd.text.slice(0,i));setT(el.radio.lastChild,rd.text.slice(i+1,i+1+(rd.t*38|0)))}
  setT(el.warn,!pl.alive?'':G.out?'已偏离战区 · 请立即返航':pl.hull<.3?'船体严重受损':pl.hot?'武器过热':'');
  if(!pl.alive)return;
  const cx=W/2,cy=H/2,MONO='11px ui-monospace,Menlo,Consolas,monospace';hx.lineWidth=1.5;hx.font=MONO;
  // 静区圈 + 机头指示
  if(!touchMode){hx.strokeStyle='rgba(232,238,242,.1)';hx.beginPath();hx.arc(cx,cy,min(W,H)*.07,0,7);hx.stroke()}
  const np=proj(ad(pl.p,pl.f,650));
  if(np[2]>0){hx.strokeStyle='rgba(232,238,242,.55)';hx.beginPath();for(const[a,b]of[[-9,-3],[3,9]]){hx.moveTo(np[0]+a,np[1]);hx.lineTo(np[0]+b,np[1]);hx.moveTo(np[0],np[1]+a);hx.lineTo(np[0],np[1]+b)}hx.stroke()}
  // 目标框 / 屏幕外箭头
  const mark=(w,col,sz,lk,txt,hp)=>{const q=proj(w);hx.strokeStyle=hx.fillStyle=col;
    if(q[2]>0&&q[0]>24&&q[0]<W-24&&q[1]>24&&q[1]<H-24){const s=clamp(sz*FL*H/2/q[2]*1.25,8,110),c=s*.4;hx.beginPath();
      for(const[x,y]of[[-1,-1],[1,-1],[1,1],[-1,1]]){hx.moveTo(q[0]+x*s,q[1]+y*(s-c));hx.lineTo(q[0]+x*s,q[1]+y*s);hx.lineTo(q[0]+x*(s-c),q[1]+y*s)}hx.stroke();
      if(lk){hx.fillRect(q[0]-s,q[1]-s-8,2*s*clamp(hp),3);hx.fillText(txt+' '+(q[2]|0)+'m',q[0]-s,q[1]+s+14)}}
    else{const a=M.atan2((q[1]-cy)*q[2],(q[0]-cx)*q[2]),r=min(W,H)*.44;hx.save();hx.translate(cx+cos(a)*r,cy+sin(a)*r);hx.rotate(a);hx.beginPath();hx.moveTo(10,0);hx.lineTo(-5,6);hx.lineTo(-5,-6);hx.fill();hx.restore()}};
  for(const e of foes)mark(e.p,e===G.lock?'#7dffb0':e.T.bomber?'#ffb347':'#ff5a40',e.T.r,e===G.lock,e.T.name,e.hp/e.T.hp);
  for(const k of picks){const q=proj(k.p);if(q[2]>0){hx.strokeStyle=k.k?'#ffb347':'#7dffb0';hx.beginPath();hx.moveTo(q[0],q[1]-7);hx.lineTo(q[0]+7,q[1]);hx.lineTo(q[0],q[1]+7);hx.lineTo(q[0]-7,q[1]);hx.closePath();hx.stroke()}}
  if(!ST.dead){const q=proj(ST.p);if(!(q[2]>0&&q[0]>0&&q[0]<W&&q[1]>0&&q[1]<H))mark(ST.p,'#72e4ff',1,0)}
  // 准星
  const rx=touchMode?np[0]:inp.mx,ry=touchMode?np[1]:inp.my,rc=pl.hot?'#ff5a40':G.lock?'#7dffb0':'#e8eef2';hx.strokeStyle=hx.fillStyle=rc;
  hx.beginPath();hx.arc(rx,ry,11,0,7);hx.stroke();hx.fillRect(rx-1,ry-1,2,2);hx.beginPath();hx.arc(rx,ry,15,-PI/2,-PI/2+PI*2*pl.heat);hx.strokeStyle='#ffb347';hx.stroke();
  // 雷达：机头朝上的俯视图，竖线表示高度差
  const Rr=min(58,W*.13),ox=cx,oy=H-Rr-(touchMode?16:26),rg=1700,rt=[cos(pl.yaw),0,-sin(pl.yaw)],fw=[sin(pl.yaw),0,cos(pl.yaw)];
  hx.fillStyle='rgba(8,12,18,.5)';hx.strokeStyle='rgba(232,238,242,.25)';hx.beginPath();hx.arc(ox,oy,Rr,0,7);hx.fill();hx.stroke();
  hx.beginPath();hx.arc(ox,oy,Rr*.5,0,7);hx.moveTo(ox,oy-Rr);hx.lineTo(ox,oy+Rr);hx.moveTo(ox-Rr,oy);hx.lineTo(ox+Rr,oy);hx.strokeStyle='rgba(232,238,242,.1)';hx.stroke();
  const blip=(w,col,s)=>{const d=sub(w,pl.p);let x=dot(d,rt)/rg,z=dot(d,fw)/rg;const m=hypot(x,z);if(m>1){x/=m;z/=m}
    const px=ox+x*Rr,py=oy-z*Rr,hh=clamp(d[1]/rg*Rr*1.5,-14,14);hx.fillStyle=hx.strokeStyle=col;hx.beginPath();hx.moveTo(px,py);hx.lineTo(px,py-hh);hx.stroke();hx.fillRect(px-s/2,py-hh-s/2,s,s)};
  if(!ST.dead)blip(ST.p,'#72e4ff',6);for(const k of picks)blip(k.p,k.k?'#ffb347':'#7dffb0',3);
  for(const e of foes)blip(e.p,e.T.bomber?'#ffb347':'#ff5a40',e.T.turret?6:4);
  hx.fillStyle='#e8eef2';hx.beginPath();hx.moveTo(ox,oy-5);hx.lineTo(ox+4,oy+4);hx.lineTo(ox-4,oy+4);hx.fill()}

/* ---------- 9 菜单与输入 ---------- */
const pn=$('#panel');let optBack='menu';
function panel(html){pn.innerHTML=html;pn.classList.toggle('hide',!html)}
function setPlay(on){document.body.classList.toggle('play',on);$('#hudBox').classList.toggle('hide',!on);$('#touch').classList.toggle('hide',!(on&&touchMode))}
function showMenu(){state='menu';setPlay(false);pl.alive=0;G.intense=0;
  panel(`<div class="mark">星际战机</div><div class="tag">曙 光 防 线</div><button class="pri" data-a="start">开始作战</button><button data-a="opts">设置</button><button data-a="help">操作说明</button><div class="foot">最高分 ${opt.best}</div>`)}
function showOpts(){panel(`<h2>设置</h2>
  <label>转向灵敏度<input type="range" min=".5" max="1.6" step=".05" value="${opt.sens}" data-o="sens"></label>
  <label>音量<input type="range" min="0" max="1" step=".05" value="${opt.vol}" data-o="vol"></label>
  <label>画质<select data-o="q"><option value="0">流畅</option><option value="1">标准</option><option value="2">高清</option></select></label>
  <label>镜头震动<select data-o="shake"><option value="0">关闭</option><option value="0.5">轻微</option><option value="1">标准</option></select></label>
  <button data-a="${optBack}">返回</button>`);pn.querySelector('[data-o=q]').value=opt.q;pn.querySelector('[data-o=shake]').value=opt.shake}
function showHelp(){panel(`<h2>操作说明</h2><div class="help">
  <b>鼠标</b><span>准星指哪打哪；移出中央小圈，飞船才会转向</span><b>左键 / 空格</b><span>激光（连射会过热）</span><b>右键 / F</b><span>追踪导弹（需先锁定目标）</span>
  <b>W / Shift</b><span>加速</span><b>S</b><span>减速</span><b>A / D</b><span>横向平移，躲子弹不用转视角</span><b>Esc</b><span>暂停</span>
  <b>触屏</b><span>左摇杆转向，右侧按钮开火</span></div>
  <div class="foot" style="margin:0 0 14px">目标：保护曙光站。橙色标记的轰炸机会直奔空间站。</div><button data-a="menu">返回</button>`)}
function showPause(){state='pause';panel(`<h2>已暂停</h2><button class="pri" data-a="resume">继续</button><button data-a="opts">设置</button><button data-a="menu">返回主菜单</button>`)}
function showOver(){state='over';setPlay(false);const nb=G.score>opt.best;if(nb){opt.best=G.score;saveOpt()}
  panel(`<h2>${G.reason}</h2><div class="stats"><span>得分</span><b>${G.score}${nb?' · 新纪录':''}</b><span>坚持到</span><b>第 ${G.wave} 波</b><span>击落</span><b>${G.kills} 架</b><span>作战时长</span><b>${(G.t/60|0)}:${String(G.t%60|0).padStart(2,'0')}</b></div>
  <button class="pri" data-a="start">再来一局</button><button data-a="menu">返回主菜单</button>`)}
function startGame(){audioInit();resetGame();state='play';panel('');setPlay(true);inp.mx=W/2;inp.my=H/2;inp.fire=inp.mis=0}
pn.addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;audioInit();sfx('ui');
  if(a==='start')startGame();else if(a==='opts'){optBack=state==='pause'?'pause':'menu';showOpts()}else if(a==='help')showHelp();
  else if(a==='menu')showMenu();else if(a==='pause')showPause();else if(a==='resume'){state='play';panel('')}});
pn.addEventListener('input',e=>{const k=e.target.dataset.o;if(!k)return;opt[k]=+e.target.value;saveOpt();if(k==='vol'&&aMaster)aMaster.gain.value=opt.vol;if(k==='q')resize()});
addEventListener('keydown',e=>{key[e.code]=1;if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')showPause();else if(state==='pause'){state='play';panel('')}}
  if(state==='play'&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>key[e.code]=0);
addEventListener('blur',()=>{for(const k in key)key[k]=0;inp.fire=0;if(state==='play')showPause()});
addEventListener('resize',resize);addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'){inp.mx=e.clientX;inp.my=e.clientY}});
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){if(!touchMode){touchMode=true;setPlay(state==='play'||state==='pause')}return}
  inp.mx=e.clientX;inp.my=e.clientY;if(state!=='play')return;if(e.button===0)inp.fire=1;if(e.button===2)inp.mis=1});
addEventListener('pointerup',e=>{if(e.pointerType!=='touch'){if(e.button===0)inp.fire=0;if(e.button===2)inp.mis=0}});
// 触屏：左摇杆 + 右侧按钮
{const stick=$('#stick'),knob=stick.firstChild;let id=null;
  const mv=e=>{const r=stick.getBoundingClientRect(),x=clamp((e.clientX-r.left-r.width/2)/(r.width/2),-1,1),y=clamp((e.clientY-r.top-r.height/2)/(r.height/2),-1,1);
    inp.sx=abs(x)<.12?0:x;inp.sy=abs(y)<.12?0:y;knob.style.transform=`translate(${x*38}px,${y*38}px)`};
  stick.addEventListener('pointerdown',e=>{id=e.pointerId;stick.setPointerCapture(id);mv(e)});
  stick.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});
  const up=e=>{if(e.pointerId===id){id=null;inp.sx=inp.sy=0;knob.style.transform=''}};stick.addEventListener('pointerup',up);stick.addEventListener('pointercancel',up);
  const hold=(sel,k)=>{const b=$(sel);b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);inp[k]=1;b.classList.add('on')});
    const u=()=>{if(k!=='mis')inp[k]=0;b.classList.remove('on')};b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u)};
  hold('#tFire','fire');hold('#tBoost','boost');hold('#tMis','mis');$('#tPause').addEventListener('pointerdown',()=>{if(state==='play')showPause()})}

/* ---------- 10 启动 ---------- */
function frame(t){requestAnimationFrame(frame);t/=1e3;const dt=clamp(t-lastT,0,.05);lastT=t;
  if(state!=='pause'){time+=dt;update(dt)}
  updCam(dt);render();hud()}
async function boot(){
  const step=(t,p)=>{$('#bootT').textContent=t;$('#bootB').style.width=p+'%';return new Promise(r=>setTimeout(r,40))};
  try{
    if(!gl)throw Error('此浏览器不支持 WebGL2，无法运行。');
    await step('正在编译着色器',12);initGL();
    await step('正在烘焙星空与行星',30);skyTex=bakeSky(min(1024,gl.getParameter(gl.MAX_CUBE_MAP_TEXTURE_SIZE))>>(matchMedia('(pointer:coarse)').matches?1:0));
    await step('正在建造曙光站',48);buildStation();
    await step('正在装配战机',62);buildShips();
    await step('正在雕刻小行星',76);buildRocks();
    await step('正在校准武器系统',90);uploadGeometry();resize();initWorld();
    await step('准备就绪',100);showMenu();$('#boot').classList.add('done');requestAnimationFrame(frame)
  }catch(e){$('#bootT').textContent='启动失败';$('#err').textContent=String(e.message||e);console.error(e)}}
boot();
</script>
</body>
</html>
