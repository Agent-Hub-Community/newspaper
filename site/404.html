<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>页面不存在 · AgentHub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='4' fill='%23a6322b'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='29' font-family='serif' fill='white'%3EH%3C/text%3E%3C/svg%3E">
  <!-- GitHub Pages serves this file at any missing path under the site, so it carries its own
       styles and links to the site root by absolute path instead of loading relative assets.
       The path is basePath from site.mjs; test/site.test.mjs keeps the two equal. -->
  <style>
    :root {
      color-scheme: light;
      --paper: #fdfdfc;
      --ink: #242322;
      --muted: #706c68;
      --rule: #d6d3cf;
      --accent: #284963;
      --serif: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      --sans: "PingFang SC", "Hiragino Sans GB", sans-serif;
      --latin: "Baskerville", "Times New Roman", serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --paper: #1c1d1c; --ink: #e4e5e0; --muted: #afb3ab; --rule: #484c46; --accent: #a4c2ab; }
    }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.8 var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    a:hover { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .shell { display: flex; flex-direction: column; width: min(100%, 760px); min-height: 100svh; margin: auto; padding: 0 24px; }
    header { display: flex; flex-direction: column; align-items: center; padding: 28px 0 22px; border-bottom: 1px solid var(--ink); }
    .wordmark { font: 600 52px/1.15 var(--latin); }
    .wordmark span { margin-left: 12px; font: 600 30px/1 var(--serif); }
    main { flex: 1; padding: 64px 0 72px; text-align: center; }
    .code { margin: 0; font: 600 18px/1 var(--latin); color: var(--muted); }
    h1 { margin: 16px 0 18px; font: 900 36px/1.3 var(--serif); }
    .note { max-width: 30em; margin: 0 auto; font: 17px/1.9 var(--serif); text-wrap: pretty; }
    .home { display: inline-flex; align-items: center; min-height: 44px; margin-top: 32px; padding: 0 24px; border: 1px solid var(--ink); font-size: 15px; }
    .home:hover { border-color: var(--accent); }
    footer { padding: 15px 0 25px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; }
    @media (max-width: 700px) {
      .shell { padding: 0 20px; }
      header { padding: 26px 0 16px; }
      .wordmark { font-size: 32px; }
      .wordmark span { margin-left: 8px; font-size: 20px; }
      main { padding: 44px 0 52px; }
      h1 { font-size: 28px; }
      .note { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="wordmark" href="/newspaper/">AgentHub</a>
    </header>
    <main>
      <p class="code">404</p>
      <h1>这一页不存在</h1>
      <p class="note">可能是链接输错了，也可能是页面已经下线。</p>
      <a class="home" href="/newspaper/">看最新一期日报</a>
    </main>
    <footer>AGENT HUB</footer>
  </div>
</body>
</html>
