  <style>

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .shell { display: flex; flex-direction: column; width: min(100%, 1296px); min-height: 100svh; margin: auto; padding: 0 48px; }

    .code { margin: 0; font: 500 13px/1 var(--sans); letter-spacing: .12em; color: var(--accent); }
    h1 { margin: 18px 0 16px; font: 500 clamp(32px, 4vw, 46px)/1.3 var(--sans); letter-spacing: -.04em; }
    .note { margin: 0; font-size: 15px; line-height: 1.95; color: var(--muted); text-wrap: pretty; }
    .home { display: inline-flex; align-items: center; align-self: flex-start; min-height: 48px; margin-top: 36px; padding: 0 26px; border: 1px solid var(--ink); border-radius: 4px; font-size: 15px; transition: background .2s, color .2s; }
    .home:hover { background: var(--ink); color: var(--paper); }
    .elsewhere { margin: 44px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }

      .wordmark span { padding-left: 12px; font-size: 17px; }
      main { justify-content: flex-start; padding: 48px 0 56px; }
      .elsewhere a small { display: none; }
