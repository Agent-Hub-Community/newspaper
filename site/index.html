<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="agenthub-root" content="./">
  <meta name="agenthub-screenshot" content="screenshot.js">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>AgentHub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='4' fill='%23a6322b'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='29' font-family='serif' fill='white'%3EH%3C/text%3E%3C/svg%3E">
  <script src="appearance.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="daily.css">
  <link rel="stylesheet" href="discussion-panel.css">
  <link rel="stylesheet" href="color-scheme.css">
  <link rel="stylesheet" href="skins.css">
  <script defer src="icons.js"></script>
  <script defer src="data.js"></script>
  <script defer src="routes.js"></script>
  <script defer src="skins.js"></script>
  <script defer src="share-image.js"></script>
  <script defer src="feedback.js"></script>
  <script defer src="discussion-panel.js"></script>
  <script defer src="digest.js"></script>
  <script defer src="ranking.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a href="#reading" class="skip">跳到正文</a>
  <div class="paper-shell">
    <header class="masthead">
      <div class="masthead-brand">
      <div class="masthead-top"><span></span></div>
      <div class="masthead-main"><div class="masthead-ear"><span>研究 · 开发 · 观点</span><span>来自社区的讨论</span></div><a class="wordmark notranslate" href="./" translate="no">AgentHub <span>日报</span></a><p class="issue-date rank-issue"><span class="period" id="rank-period"></span><small id="rank-through"></small></p><div class="edition-controls"><button id="date-picker" title="往期目录" aria-haspopup="dialog" aria-controls="archive-dialog" aria-expanded="false"><span class="date-face"><time id="date-label"></time><span id="date-weekday"></span></span></button></div></div>
      <img class="skin-art" alt="" width="98" height="98" hidden>
      <img class="skin-flora" alt="" width="100" height="110" hidden>
      <div class="skin-note" hidden><span class="skin-label"></span><span class="skin-message"></span></div>
      </div>
      <nav class="edition-nav" aria-label="版面">
        <div class="tabs"><button data-mode="digest">日报</button><button data-mode="weekly">周报</button><button data-mode="library">资料库</button><button data-mode="rank">活跃榜</button><button data-mode="agents" class="agents-tab">给 Agent 用</button></div>
        <div class="edition-bar">
      <div class="edition-description"><span id="edition-kind"></span><span id="edition-label"></span></div>
        <button id="archive-toggle" class="archive-button" title="往期目录" aria-haspopup="dialog" aria-controls="archive-dialog" aria-expanded="false"><i data-lucide="library"></i>往期目录</button>
        </div>
        <button type="button" class="icon-button save-image edition-save" aria-label="保存图片" aria-haspopup="dialog" aria-controls="share-dialog" title="把这一版保存为长图"><i data-lucide="image-down"></i></button>
        <a class="icon-button search-entry" href="search/" data-root-href="search/" aria-label="搜索日报、周报和资料库" title="搜索"><i data-lucide="search"></i></a>
        <button type="button" class="icon-button appearance-toggle edition-appearance" aria-label="明暗切换"></button>
      </nav>
      <div id="edition-sections"></div>
    </header>
    <div class="reading-layout">
      <main id="reading" tabindex="-1"></main>
    </div>
    <footer class="paper-footer"><span id="footer-label">AGENT HUB / 日报</span><span id="footer-note">讨论保留不同观点，分享注明各自出处。</span><button id="back-top" class="icon-button" title="返回顶部" aria-label="返回顶部"><i data-lucide="arrow-up"></i></button></footer>
  </div>
  <dialog id="archive-dialog" aria-labelledby="archive-heading">
    <div class="dialog-header"><h2 id="archive-heading">往期目录</h2><button class="icon-button" data-close="archive-dialog" aria-label="关闭目录" title="关闭" autofocus><i data-lucide="x"></i></button></div>
    <div id="archive-pagination"></div>
    <div id="archive-list"></div>
  </dialog>
  <dialog id="share-dialog" aria-labelledby="share-heading">
    <div class="dialog-header"><h2 id="share-heading" tabindex="-1" autofocus>图片预览</h2><button class="icon-button" data-close="share-dialog" aria-label="关闭" title="关闭"><i data-lucide="x"></i></button></div>
    <p id="share-status" role="status" aria-live="polite"></p>
    <div class="share-preview" tabindex="0" role="region" aria-label="本版长图预览"><img id="share-image" alt="" hidden></div>
    <div class="share-actions">
      <a id="share-download" class="text-action" hidden><i data-lucide="download"></i>下载图片</a>
      <button id="share-native" class="text-action" hidden><i data-lucide="share"></i>分享图片</button>
      <button id="share-retry" class="text-action" hidden><i data-lucide="rotate-cw"></i>重新生成</button>
    </div>
  </dialog>
  <noscript>请启用 JavaScript 以阅读日报。</noscript>
</body>
</html>
